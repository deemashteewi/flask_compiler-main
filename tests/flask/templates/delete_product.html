<!DOCTYPE html>
<html>
<head>
    <title>Delete Product</title>
        <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-delete">
    <nav class="navbar">
        <a href="/" class="nav-brand">Shop</a>
        <a href="/" class="nav-link">Products</a>
        <a href="/add" class="nav-link">Add Product</a>
    </nav>
    <div class="page-wrap">
        <div class="container">
            {% if product %}
            <h1>Delete Product</h1>
            <p class="warning">Are you sure you want to delete
                <span class="delete-product-name">{{ product.name }}</span>?
                This action cannot be undone.</p>
            <div class="actions">
                <form method="POST" class="delete-form">
                    <button type="submit" class="button confirm-button">Yes, Delete</button>
                </form>
                <a href="/product/{{ product.id }}" class="button cancel-link">Cancel</a>
            </div>
            {% else %}
            <div class="not-found">
                <p>Product not found.</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
