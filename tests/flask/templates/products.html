<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
        <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-index">
    <nav class="navbar">
        <a href="/" class="nav-brand">Shop</a>
        <a href="/" class="nav-link active">Products</a>
        <a href="/add" class="nav-link">Add Product</a>
    </nav>
    <div class="container">
        <h1>Products</h1>
        <p class="subtitle">Browse our collection of products</p>
        <div class="header-section">
            <a href="/add" class="button">Add New Product</a>
        </div>

        <div class="product-list">
            {% for product in products %}
            <div class="product-card">
                <div class="product-image">
                    <img src="{{ product.image }}" alt="{{ product.name }}">
                </div>
                <div class="product-info">
                    <div class="product-name">{{ product.name }}</div>
                    <div class="product-price">${{ product.price }}</div>
                    <div class="card-actions">
                        <a href="/product/{{ product.id }}" class="view-link">View Details</a>
                        <a href="/delete/{{ product.id }}" class="delete-link">Delete</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
