<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
        <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-index">
    <nav class="navbar">
        <a href="/" class="nav-brand">Shop</a>
        <a href="/" class="nav-link active">Products</a>
        <a href="/add" class="nav-link">Add Product</a>
    </nav>
    <div class="container">
        <h1>Products</h1>
        <p class="subtitle">Browse our collection of products</p>
        <div class="header-section">
            <a href="/add" class="button">Add New Product</a>
        </div>

        <div class="product-list">
            
            <div class="product-card">
                <div class="product-image">
                    <img src="https://cdn.mos.cms.futurecdn.net/Ukb33rWBxQ2gH2vHmq64B3.jpg" alt="Laptop">
                </div>
                <div class="product-info">
                    <div class="product-name">Laptop</div>
                    <div class="product-price">$999.99</div>
                    <div class="card-actions">
                        <a href="/product/1" class="view-link">View Details</a>
                        <a href="/delete/1" class="delete-link">Delete</a>
                    </div>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-image">
                    <img src="https://i.pcmag.com/imagery/roundups/05PB0LirhK28UDCznfU5X4O-8..v1740688630.jpg" alt="Phone">
                </div>
                <div class="product-info">
                    <div class="product-name">Phone</div>
                    <div class="product-price">$699.99</div>
                    <div class="card-actions">
                        <a href="/product/2" class="view-link">View Details</a>
                        <a href="/delete/2" class="delete-link">Delete</a>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
